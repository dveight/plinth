# ─────────────────────────────────────────────────────────────
# Plinth — MPV Configuration
# ─────────────────────────────────────────────────────────────
# ── Display ───────────────────────────────────────────────────
fs=yes                          # fullscreen
no-osc                          # no on-screen controller
no-osd-bar                      # no seek bar
cursor-autohide=always          # always hide cursor
#no-input-default-bindings       # disable keyboard shortcuts
no-input-cursor                 # ignore cursor input

# ── Server ───────────────────────────────────────────────────
input-ipc-server=/home/dveight/plinth/plinth.sock

# ── Cache ─────────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB
cache-secs=10

# ── Decode & GPU ─────────────────────────────────────────────
hwdec=vaapi-copy
hwdec-codecs=h264
vo=gpu
gpu-api=vulkan
scale=bilinear
cscale=bilinear
deband=no
video-sync=display-resample
interpolation=no

# ── Frame queue ───────────────────────────────────────────────
vd-lavc-threads=2
video-latency-hacks=yes
vd-lavc-dr=yes

# ── Playback ──────────────────────────────────────────────────
loop-playlist=inf               # loop forever
no-audio                        # no audio output
